<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Induction Portal Admin</title>
  <meta name="description" content="Admin portal: progress, screen time and quiz results of every manager across all teams.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">S</span>
      <div>
        <div class="brand-title">Managerial Induction Training — Admin</div>
        <div class="brand-sub" id="brandSub"></div>
      </div>
    </div>
    <div class="topbar-right" id="topbarRight" hidden>
      <span class="sync-chip" id="liveState" data-state="local"></span>
      <div class="user-chip" id="adminChip"></div>
      <button class="btn ghost small" id="signOutBtn">Sign out</button>
    </div>
  </header>

  <main id="app" class="container wide"></main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <footer class="footer"><a href="index.html">← Manager portal</a></footer>

  <script>document.write('<script src="js/firebase-config.js?v=' + Math.floor(Date.now() / 300000) + '"><\/script>');</script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script>
    // Load the portal's own scripts with a cache-busting tag (refreshed every 5 minutes) so
    // phones and browsers always pick up newly published team content and fixes.
    (function () {
      var v = Math.floor(Date.now() / 300000);
      ["js/content.js", "js/store.js", "js/admin.js"].forEach(function (f) { document.write('<script src="' + f + '?v=' + v + '"><\/script>'); });
    })();
  </script>
</body>
</html>
