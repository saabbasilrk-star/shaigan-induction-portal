<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shaigan Managerial Induction Training Portal</title>
  <meta name="description" content="Shaigan Managerial Induction Training Portal: team-wise induction modules, quizzes and assessment for managers.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="assets/img/shaigan-logo.png" alt="Shaigan Pharmaceuticals logo" width="46" height="47">
      <div>
        <div class="brand-title" id="brandTitle">Shaigan Managerial Induction Training Portal</div>
        <div class="brand-sub" id="brandSub"></div>
      </div>
    </div>
    <div class="topbar-right" id="topbarRight" hidden>
      <div class="screen-timer" title="Active screen time (pauses when idle or the tab is hidden)">
        <span class="dot" id="timerDot"></span>
        <span class="timer-label">Screen time</span>
        <span class="timer-value" id="screenTime">00:00:00</span>
      </div>
      <span class="sync-chip" id="syncState" data-state="local" title="Where your progress is saved"></span>
      <div class="user-chip" id="userChip"></div>
      <button class="btn ghost small" id="logoutBtn">Sign out</button>
    </div>
  </header>

  <main id="app" class="container"></main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <footer class="footer">
    <span id="footerText"></span>
  </footer>

  <script>document.write('<script src="js/firebase-config.js?v=' + Math.floor(Date.now() / 300000) + '"><\/script>');</script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script>
    // Load the portal's own scripts with a cache-busting tag (refreshed every 5 minutes) so
    // phones and browsers always pick up newly published team content and fixes.
    (function () {
      var v = Math.floor(Date.now() / 300000);
      ["js/content.js", "js/store.js", "js/app.js"].forEach(function (f) { document.write('<script src="' + f + '?v=' + v + '"><\/script>'); });
    })();
  </script>
</body>
</html>
